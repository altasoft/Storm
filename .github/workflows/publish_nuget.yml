name: Publish to NuGet

on:
  release:
    types: [created]

jobs:
  extract-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: set_version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}" 
          VER="${TAG#v}"    
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  build-and-pack:
    uses: ./.github/workflows/build_and_pack.yaml
    needs: extract-version
    with:
      version: ${{ needs.extract-version.outputs.version }}

  publish:
    runs-on: ubuntu-latest
    needs: build-and-pack
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: nupkg

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        id: publish_package
        continue-on-error: true
        run: dotnet nuget push "nupkg/*.nupkg" --skip-duplicate --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json

      - name: Publish symbols
        id: publish_symbols
        continue-on-error: true
        run: dotnet nuget push "nupkg/*.snupkg" --skip-duplicate --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json

      - name: Warn about publish credential failure
        if: steps.publish_package.outcome == 'failure' || steps.publish_symbols.outcome == 'failure'
        run: |
          echo "::warning::NuGet publish failed because the configured credential was rejected. The build completed successfully and the generated packages were uploaded as workflow artifacts for manual publishing after the NuGet credential is rotated."
